/* Apply saved theme / language before first paint to avoid a flash. */
(function () {
  try {
    var d = document.documentElement;
    var t = localStorage.getItem('iw-theme');
    var l = localStorage.getItem('iw-lang');
    if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) d.setAttribute('data-theme', 'light');
    if (l === 'ar') { d.lang = 'ar'; d.dir = 'rtl'; }
  } catch (e) {}
})();
</script>
